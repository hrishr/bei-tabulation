<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEI Tabulation – HRMDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#2f6b45;--olive-d:#1f4d32;--olive-2:#4d8a5a;--olive-l:#e8f0e4;
  --gold:#c9a227;--gold-2:#e6c453;--gold-d:#b58a2a;
  --cream:#f6f1e3;--paper:#fbf8ef;
  --ink:#1f2a1f;--muted:#6b705f;--line:#e4dcc2;
  --ok:#2f6b45;--warn:#a8841c;--bad:#b5382a;
  --ring:rgba(47,107,69,.28);
  --fh:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;
  --fb:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);
  --shadow-md:0 10px 30px rgba(31,77,50,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--fb);background:var(--cream);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);letter-spacing:-.01em;margin:0 0 10px;line-height:1.2}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1150px;margin:0 auto;padding:0 20px}
#app{min-height:100vh;display:flex;flex-direction:column}
main{flex:1 0 auto;width:100%;max-width:1150px;margin:0 auto;padding:30px 20px 50px}

/* nav */
header.nav{position:sticky;top:0;z-index:50;background:rgba(31,77,50,.94);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);border-bottom:2px solid var(--gold-d)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--fh);font-weight:700}
.brand .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gold);padding:2px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand .dot img{width:100%;height:100%;border-radius:50%}
.nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.nav-links a{color:#d9e5d2;font-size:.88rem;font-weight:500;padding:7px 11px;border-radius:999px;transition:.2s}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.12)}
.nav-links a.on{background:var(--gold);color:var(--olive-d);font-weight:600}
.nav-links a.nav-cta{background:transparent;border:1px solid #ffffff60;color:#fff;margin-left:6px}
.nav-links a.nav-cta:hover{background:#ffffff22}
.nav-links .who{color:#fff;font-size:.85rem;margin-left:8px}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px}
.badge.firebase{background:var(--gold);color:var(--olive-d)}
.badge.local{background:#fff3;color:#fff}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}

/* hero banner */
.hero{background:linear-gradient(135deg,var(--olive-d),var(--olive));color:#fff;border-bottom:7px solid var(--gold-d);padding:34px 0}
.hero.compact{padding:16px 0}
.hero-grid{display:flex;align-items:center;gap:26px}
.hero .seal{width:100px;height:100px;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
.hero.compact .seal{width:58px;height:58px}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:700;color:#fbf6e6;margin:0 0 8px}
.hero.compact h1{font-size:clamp(1.15rem,2.6vw,1.5rem);margin-bottom:2px}
.hero p{margin:2px 0;font-size:.95rem;color:#e6efdd}
.hero.compact p{font-size:.85rem}

/* section chrome */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:700;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d);margin-bottom:8px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold-d);border-radius:2px}
.sec-title{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800;color:var(--olive-d);margin-bottom:6px}
.sec-sub{color:var(--muted);max-width:640px;margin:0 0 24px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card h3{color:var(--olive-d)}
.login{max-width:430px;margin:10px auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px;margin-bottom:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:.25s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.pcard::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--gold),var(--gold-2));transform:scaleY(0);transform-origin:bottom;transition:.25s}
.pcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:#e1cf93}
.pcard:hover::after{transform:scaleY(1)}
.pcard.add{align-items:center;justify-content:center;border:2px dashed #cdbd85;background:#fffdf5;color:var(--olive-d);font-family:var(--fh);font-weight:600;font-size:1rem;cursor:pointer;min-height:220px}
.pcard.add span{font-size:2.2rem;color:var(--gold-d);line-height:1}
.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--fh);font-weight:800;color:var(--olive-d);background:linear-gradient(135deg,var(--gold),var(--gold-2));box-shadow:0 6px 16px rgba(201,162,39,.35)}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
button{font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:600;font-size:.92rem;background:linear-gradient(135deg,var(--olive),var(--olive-2));color:#fff;border:0;padding:11px 22px;border-radius:999px;cursor:pointer;box-shadow:0 8px 20px var(--ring);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{background:#b9c4b4;box-shadow:none;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--olive-d);box-shadow:0 8px 20px rgba(201,162,39,.35)}
.btn.ok{background:linear-gradient(135deg,var(--olive-d),var(--olive))}
.btn.sec{background:#fff;color:var(--olive-d);border:1px solid var(--olive);box-shadow:none}
.del{background:#fff;border:1px solid var(--line);color:var(--bad);border-radius:8px;cursor:pointer;padding:4px 10px}
.del:hover{background:#fbeae7}

/* forms */
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fffefb;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(201,162,39,.55);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#efe9d3;color:#5b5a45}
.pill.ok{background:var(--olive-l);color:var(--olive)}
.pill.warn{background:#faf0cb;color:var(--warn)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:200px}
.err{color:var(--bad);margin:8px 0}
.banner{background:#faf0cb;color:#6f5612;padding:8px 20px;font-size:13px;text-align:center}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:var(--olive-d)}
.seg button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff;box-shadow:var(--shadow-sm);transition:.2s}
.cand:hover{border-color:#e1cf93;transform:translateY(-2px)}
.total{font-family:var(--fh);font-size:1.5rem;font-weight:700;color:var(--olive)}
.hint{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--olive);margin-top:12px;font-weight:600}
footer.foot{margin-top:auto;flex-shrink:0;background:var(--olive-d);color:#c9d6c0;text-align:center;padding:22px 0;font-size:.85rem;border-top:4px solid var(--gold-d)}

/* judge rating */
.crit{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;background:#fff;box-shadow:var(--shadow-sm)}
.crit h4{margin:0 0 10px;font-size:1.05rem;color:var(--olive-d)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media(max-width:900px){.opts,.lvgrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.opts,.lvgrid{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;border:2px solid var(--line);background:#fffefb;border-radius:12px;padding:12px;cursor:pointer;font-size:13px;color:var(--ink);line-height:1.4;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.opt .n{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--gold-d);display:flex;justify-content:space-between}
.opt ul{margin:6px 0 0 16px;padding:0}
.opt.on{border-color:var(--olive);background:var(--olive-l)}
.opt.on .n{color:var(--olive)}
.opt:disabled{cursor:default}

@media(max-width:900px){
  .burger{display:block}
  .nav-links.menu{display:none;width:100%;flex-direction:column;align-items:stretch;padding-bottom:8px}
  .nav-links.menu.open{display:flex}
  .hero-grid{gap:16px}
  .hero .seal{width:70px;height:70px}
}

.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.imgtile{display:flex;flex-direction:column;gap:8px}
.imgbox{background:#fff;border:1px solid var(--line);border-radius:12px;height:120px;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
.imgtile.add{cursor:pointer}
.imgtile.add .imgbox{border:2px dashed #cdbd85;background:#fffdf5;color:var(--olive-d);font-family:var(--fh);font-weight:600;flex-direction:column;gap:4px}
.imgtile.add .imgbox span{font-size:2rem;color:var(--gold-d);line-height:1}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns2 .btn{padding:8px 6px;font-size:.82rem;justify-content:center}
/* ---------- printed forms ---------- */
#printArea{display:none}
.sheet{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11px;padding:10px 6px 18px;border-bottom:2px dashed #bbb;margin-bottom:18px}
.ph{display:flex;align-items:center;gap:12px;padding-bottom:6px}
.ph .lg{display:flex;gap:6px;align-items:center}
.ph .lg img{height:62px;width:auto}
.ph .lg.r{margin-left:auto}
.ph .lg.r img{height:56px}
.pt{line-height:1.25;font-size:11px}
.pt .b{font-weight:700;font-size:12px}
.pt .it{font-style:italic}
.rule{border-top:2px solid #000;margin-bottom:12px}
.hdrimg{margin-bottom:10px}
.hdrimg img{width:100%;max-height:46mm;object-fit:contain;display:block}
.hdrrow{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px}
.hdrrow img{height:22mm;width:auto;min-width:0;object-fit:contain;display:block}
.pof{text-align:center;font-weight:700;font-size:12.5px;margin:6px 0}
.pfm{text-align:center;font-weight:700;font-size:12.5px;margin:6px 0 14px}
.fl{display:flex;gap:14px;margin-bottom:8px;font-size:12px;align-items:flex-end}
.fl .x{flex:1;display:flex;gap:6px;align-items:flex-end}
.fl .u{flex:1;border-bottom:1px solid #000;min-height:15px;padding:0 4px;font-weight:400}
.dir{text-align:justify;margin:12px 0;line-height:1.35}
.sheet table{width:100%;border-collapse:collapse}
table.cr th,table.cr td{border:1px solid #000;padding:3px 5px;vertical-align:top;text-align:left;font-size:9px;line-height:1.25}
table.cr th{text-align:center;font-size:10px}
table.cr tr{break-inside:avoid;page-break-inside:avoid}
table.cr td.cn{width:9%;font-size:10px}
table.cr td.sc{width:7%;text-align:center;font-size:16px;font-weight:700;vertical-align:middle}
table.cr ul{margin:2px 0 0 12px;padding:0}
table.cr li{margin-bottom:2px}
.keep{break-inside:avoid;page-break-inside:avoid}
.cm{font-weight:700;margin:14px 0 4px;font-size:12px}
.notes{min-height:112px;line-height:22px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 21px,#000 21px,#000 22px);white-space:pre-wrap;font-size:11px}
.sm{font-weight:700;font-size:12px;margin:14px 0 6px}
table.sum{width:48%;border-collapse:collapse}
table.sum th,table.sum td{border:1px solid #000;padding:5px 8px;font-size:11px;text-align:left}
table.sum td.c{text-align:center}
.sg{text-align:center;margin-top:20px}
.sg .nm{min-height:15px;font-size:11px}
.sg .ln{display:inline-block;border-top:1px solid #000;padding-top:2px;min-width:230px}
table.grid2 th,table.grid2 td{border:1px solid #000;padding:4px 6px;font-size:11px;text-align:left}
table.grid2 th{background:#eee}
table.grid2 .c{text-align:center}
.sigrow{display:flex;gap:30px;justify-content:space-around;margin-top:26px;flex-wrap:wrap}
.sigrow div{text-align:center;min-width:170px}
.sigrow .l{border-top:1px solid #000;padding-top:3px;font-weight:700}
.sigrow .tt{font-size:10px}
@media print{
  body{background:#fff}
  #app{display:none!important}
  #printArea{display:block}
  .sheet{border:0;margin:0;padding:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  table.grid2 th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageStyle">@page{size:A4;margin:12mm}</style>

function localBackend() {
  const KEY = 'bei_local_v2';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const pull = () => {
    const s = load();
    COLS.forEach(c => { if (c === 'event') D.event = s.event || {}; else D[c] = Object.values(s[c] || {}); });
  };
  pull();
  window.addEventListener('storage', e => { if (e.key === KEY) { pull(); changed(); } });
  return {
    mode: 'local',
    async save(col, id, obj) {
      const s = load();
      if (col === 'event') s.event = { ...(s.event || {}), ...obj };
      else { s[col] = s[col] || {}; s[col][id] = { ...(s[col][id] || {}), ...obj, id }; }
      localStorage.setItem(KEY, JSON.stringify(s)); pull(); changed();
    },
    async remove(col, id) {
      const s = load(); if (s[col]) delete s[col][id];
      localStorage.setItem(KEY, JSON.stringify(s)); pull(); changed();
    }
  };
}

async function fbBackend(cfg) {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } =
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db = getFirestore(initializeApp(cfg));
  const onErr = e => { S.fb = 'Firestore error: ' + e.message; render(); };
  COLS.forEach(c => {
    if (c === 'event') onSnapshot(doc(db, 'bei_event', 'main'), s => { D.event = s.exists() ? s.data() : {}; changed(); }, onErr);
    else onSnapshot(collection(db, 'bei_' + c), s => { D[c] = s.docs.map(d => ({ ...d.data(), id: d.id })); changed(); }, onErr);
  });
  return {
    mode: 'firebase',
    save: (col, id, obj) => col === 'event'
      ? setDoc(doc(db, 'bei_event', 'main'), obj, { merge: true })
      : setDoc(doc(db, 'bei_' + col, id), { ...obj, id }, { merge: true }),
    remove: (col, id) => deleteDoc(doc(db, 'bei_' + col, id))
  };
}

const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
const crit = () => [...D.criteria].sort(byOrder);
const cands = () => [...D.candidates].sort(byOrder);
const judges = () => [...D.judges].sort(byOrder);
const scoreOf = (j, c) => D.scores.find(s => s.id === j + '_' + c);
const maxTotal = () => crit().length * LEVELS;
const fmt = n => (n == null ? '—' : (Math.round(n * 100) / 100).toString());

function calc(j, c) {
  const s = scoreOf(j, c), cr = crit();
  if (!s) return { pts: null, done: 0, n: cr.length, submitted: false, complete: false };
  let sum = 0, done = 0;
  cr.forEach(x => { const r = s.ratings && s.ratings[x.id]; if (r != null) { done++; sum += r; } });
  return { pts: done ? sum : null, done, n: cr.length, submitted: !!s.submitted, complete: done === cr.length && cr.length > 0 };
}

function results() {
  const R = cands().map(c => {
    const per = judges().map(j => ({ j, ...calc(j.id, c.id) }));
    const ok = per.filter(p => p.submitted && p.complete);
    const avg = ok.length ? ok.reduce((a, p) => a + p.pts, 0) / ok.length : null;
    return { c, per, avg, count: ok.length, rank: null };
  });
  const ranked = R.filter(r => r.avg != null).sort((a, b) => b.avg - a.avg);
  ranked.forEach((r, i) => {
    const prev = ranked[i - 1];
    r.rank = prev && fmt(prev.avg) === fmt(r.avg) ? prev.rank : i + 1;
  });
  return R.sort((a, b) => (a.rank ?? 9999) - (b.rank ?? 9999) || byOrder(a.c, b.c));
}

/* ------------------------ uploads (Excel / image) ------------------------ */
async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Excel reader failed to load'));
    document.head.appendChild(s);
  });
  return window.XLSX;
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
async function readRows(file) {
  if (/\.(csv|txt)$/i.test(file.name)) return parseCSV((await file.text()).replace(/^﻿/, ''));
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
}
async function importApplicants(file) {
  let rows;
  try { rows = await readRows(file); }
  catch (err) { alert('Could not read that file.' + (/\.(csv|txt)$/i.test(file.name) ? '' : ' The Excel reader needs an internet connection; you can also save the sheet as CSV and upload that.')); return; }
  rows = rows.map(r => r.map(v => String(v ?? '').trim())).filter(r => r.some(v => v));
  if (!rows.length) { alert('The file is empty.'); return; }
  const head = rows[0].map(v => v.toLowerCase());
  const find = re => head.findIndex(v => re.test(v));
  let iN = find(/name/), iP = find(/position/), iU = find(/unit|campus|office|college|department/), start = 1;
  if (iN < 0) { iN = 0; iP = 1; iU = 2; start = 0; }
  const have = new Set(D.candidates.map(c => (c.name + '|' + (c.position || '')).toLowerCase()));
  const list = [];
  rows.slice(start).forEach(r => {
    const name = r[iN] || ''; if (!name) return;
    const position = iP >= 0 ? r[iP] || '' : '', office = iU >= 0 ? r[iU] || '' : '';
    const key = (name + '|' + position).toLowerCase();
    if (have.has(key)) return; have.add(key);
    list.push({ name, position, office });
  });
  const skipped = rows.length - start - list.length;
  if (!list.length) { alert('No new applicants found in the file.' + (skipped ? ' (' + skipped + ' duplicate or blank rows skipped)' : '')); return; }
  if (!confirm('Import ' + list.length + ' applicant' + (list.length > 1 ? 's' : '') + (skipped ? ' (' + skipped + ' duplicate/blank rows skipped)' : '') + '?')) return;
  list.forEach((c, i) => backend.save('candidates', uid(), { ...c, order: Date.now() + i }));
}
function processImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = Math.min(img.naturalWidth, 1400), out = '';
      for (let t = 0; t < 6; t++) {
        const h = Math.round(img.naturalHeight * w / img.naturalWidth);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/jpeg', t < 3 ? .9 : .7);
        if (out.length < 450000) break;
        w = Math.round(w * .8);
      }
      res(out);
    };
    img.src = url;
  });
}

/* ------------------------- header images (up to 8) ------------------------- */
const MAX_IMG = 8;
const hdrItems = () => {
  const l = D.images.filter(x => x.data).sort(byOrder).map(x => ({ id: x.id, data: x.data }));
  return l.length || !ev().headerImage ? l : [{ id: 'legacy', data: ev().headerImage }];
};
async function handleHdrFiles(inp, mode, id) {
  const files = [...(inp.files || [])]; inp.value = '';
  if (!files.length) return;
  const have = hdrItems().length, base = Date.now();
  try {
    if (mode === 'replace') {
      const url = await processImage(files[0]);
      if (id === 'legacy') { await backend.save('images', uid(), { data: url, order: base }); await backend.save('event', 'main', { headerImage: '' }); }
      else await backend.save('images', id, { data: url });
    } else {
      const use = files.slice(0, Math.max(0, MAX_IMG - have));
      if (!use.length) { alert('You already have ' + MAX_IMG + ' images. Remove one first.'); return; }
      if (!D.images.length && ev().headerImage) {
        await backend.save('images', uid(), { data: ev().headerImage, order: base - 1 });
        await backend.save('event', 'main', { headerImage: '' });
      }
      let i = 0;
      for (const f of use) await backend.save('images', uid(), { data: await processImage(f), order: base + i++ });
      if (files.length > use.length) alert('Only ' + MAX_IMG + ' images are allowed, so ' + (files.length - use.length) + ' file(s) were not added.');
    }
  } catch (err) { alert('Could not use that image (' + (err && err.message || 'error') + '). Please use a PNG or JPG file.'); }
}

    case 'csvResults': {
      const R = results(), jl = judges();
      const rows = [['Rank', 'Applicant', 'Position', 'Unit/Campus', ...jl.map(j => j.name + ' (out of ' + maxTotal() + ')'), 'Average', 'Judges submitted']];
      R.forEach(r => rows.push([r.rank ?? '', r.c.name, r.c.position || ev().position, r.c.office || '', ...r.per.map(p => p.submitted ? p.pts : ''), r.avg != null ? Math.round(r.avg * 100) / 100 : '', r.count + '/' + jl.length]));
      download('BEI_results_' + today() + '.csv', csv(rows), 'text/csv;charset=utf-8'); break;
    }
    case 'csvDetail': {
      const cr = crit();
      const rows = [['Judge', 'Applicant', 'Position', ...cr.map(x => x.name), 'Total', 'Status', 'Remarks']];
      judges().forEach(j => cands().forEach(c => {
        const s = scoreOf(j.id, c.id), k = calc(j.id, c.id);
        rows.push([j.name, c.name, c.position || ev().position, ...cr.map(x => (s && s.ratings && s.ratings[x.id]) ?? ''), k.pts ?? '', k.submitted ? 'Submitted' : k.done ? 'Draft' : 'Not started', (s && s.remarks) || '']);

    }

    case 'del':
      if (confirm('Delete this entry?')) backend.remove(d.col, d.id);
      break;
    case 'addCrit': backend.save('criteria', uid(), { name: 'New criterion', levels: [0, 1, 2, 3].map(() => L('', '')), order: Date.now() }); break;
    case 'loadForm':
      DEFAULT_CRITERIA.forEach((x, i) => backend.save('criteria', uid(), { name: x.name, levels: x.levels, order: Date.now() + i }));
      break;
    case 'createJudges': {
      const n = Math.min(30, Math.max(1, parseInt(($('#jcount') || {}).value, 10) || 0));
      const need = n - D.judges.length;
      if (need <= 0) { alert('You already have ' + D.judges.length + ' judges.'); break; }
      const used = new Set(D.judges.map(x => String(x.username || '').toLowerCase()));
      const base = Date.now();
      for (let made = 0, k = 1; made < need; k++) {
        if (used.has('judge' + k)) continue;
        backend.save('judges', uid(), { username: 'Judge' + k, name: 'Judge ' + k, title: '', pin: String(k).repeat(4).slice(0, 4), order: base + made });
        made++;
      }
      break;
    }
    case 'resetLogins':
      if (confirm('Set every judge to Judge1 / 1111, Judge2 / 2222 and so on, in the order shown? Names stay the same.'))
        judges().forEach((j, i) => backend.save('judges', j.id, { username: 'Judge' + (i + 1), pin: String(i + 1).repeat(4).slice(0, 4) }));
      break;
    case 'addJudge': {
      const used = new Set(D.judges.map(x => String(x.username || '').toLowerCase()));
      let n = 1; while (used.has('judge' + n)) n++;
      backend.save('judges', uid(), { username: 'Judge' + n, name: 'Judge ' + n, title: '', pin: String(n).repeat(4).slice(0, 4), order: Date.now() });
      break;
    }
    case 'addCand': backend.save('candidates', uid(), { name: 'New applicant', position: '', office: '', order: Date.now() }); break;
    case 'bulkCand': {
      const names = ($('#bulk').value || '').split('\n').map(x => x.trim()).filter(Boolean);
      names.forEach((n, i) => backend.save('candidates', uid(), { name: n, position: '', office: '', order: Date.now() + i }));
      break;
    }
    case 'clearScores':
      if (confirm('Delete ALL submitted and draft scores? This cannot be undone.')) D.scores.forEach(s => backend.remove('scores', s.id));
      break;
    case 'reopen':
      if (confirm('Reopen this rating so the judge can edit it?')) saveScore(d.j, d.c, { submitted: false });
      break;
    case 'print': refreshPrint(); window.print(); break;
    case 'open': S.cand = d.id; render(); window.scrollTo(0, 0); break;
    case 'back': S.cand = null; render(); break;
    case 'rate': {
      const s = scoreOf(S.judgeId, S.cand);
      if (s && s.submitted) break;
      saveScore(S.judgeId, S.cand, { ratings: { ...((s && s.ratings) || {}), [d.c]: +d.v }, submitted: false, updatedAt: Date.now() });
      break;
    }
    case 'submit':
      if (calc(S.judgeId, S.cand).complete && confirm('Submit final rating? You will not be able to edit it afterwards.'))
        saveScore(S.judgeId, S.cand, { submitted: true, submittedAt: Date.now() });
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.xl) { const f = t.files && t.files[0]; t.value = ''; if (f) importApplicants(f); return; }
  if (d.hdr) { handleHdrFiles(t, d.hdr, d.id); return; }
  if (d.ev) backend.save('event', 'main', { [d.ev]: t.value });
  else if (d.lv) {
    const x = D.criteria.find(c => c.id === d.lv); if (!x) return;
    const lv = [0, 1, 2, 3].map(i => ({ t: '', b: '', ...((x.levels || [])[i] || {}) }));
    lv[+d.i][d.k] = t.value;
    backend.save('criteria', d.lv, { levels: lv });
  }
  else if (d.crit) backend.save('criteria', d.crit, { [d.f]: t.value });
  else if (d.jud) backend.save('judges', d.jud, { [d.f]: t.value });
  else if (d.cand) backend.save('candidates', d.cand, { [d.f]: t.value });
  else if (d.remarks && S.cand) backend.save('scores', S.judgeId + '_' + S.cand, { judgeId: S.judgeId, candidateId: S.cand, remarks: t.value, updatedAt: Date.now() });
  else if (d.pr) { S[d.pr] = t.value; render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'pin' || e.target.id === 'juser')) { const b = document.querySelector('[data-act="login"]'); if (b) b.click(); }
});

/* -------------------------------- boot -------------------------------- */
(async function init() {
  let cfg = FIREBASE_CONFIG;
  if (!cfg) { try { cfg = JSON.parse(localStorage.getItem('bei_fbconfig') || 'null'); } catch { cfg = null; } }
  if (cfg) {
    try { backend = await fbBackend(cfg); }
    catch (err) { S.fb = 'Could not connect to Firebase (' + err.message + '). Running in local mode.'; backend = localBackend(); }
  } else backend = localBackend();
  render();
})();
</script>
